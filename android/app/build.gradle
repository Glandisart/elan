plugins {
    id 'com.android.application'
}

def runNumber = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
def ksPass = System.getenv('ELAN_KS_PASS') ?: 'elan-public-key'

android {
    namespace 'fr.glandisart.elan'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.glandisart.elan'
        minSdk 24
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    signingConfigs {
        release {
            storeFile file('elan.keystore')
            storePassword ksPass
            keyAlias 'elan'
            keyPassword ksPass
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
